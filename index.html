<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Bloomci · 技能交易平台</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --pk: #F9A8C9;
    --pk-light: #FDF0F5;
    --pk-mid: #F472B6;
    --pk-dark: #BE185D;
    --pk-border: #FBCFE8;
    --pk-soft: #FCE7F3;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --text-hint: #9ca3af;
    --bg: #FFF8FB;
    --white: #ffffff;
    --radius: 16px;
    --radius-sm: 12px;
    --radius-pill: 20px;
  }
  html, body { height: 100%; background: var(--bg); font-family: 'Nunito', sans-serif; }
  .app { max-width: 390px; margin: 0 auto; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }

  /* HEADER */
  .header { background: var(--white); padding: 16px; border-bottom: 0.5px solid var(--pk-border); }
  .logo { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 10px; letter-spacing: -0.5px; }
  .logo span { color: var(--pk-mid); }
  .search-bar { display: flex; align-items: center; background: var(--pk-light); border-radius: var(--radius-pill); padding: 9px 14px; gap: 8px; border: 0.5px solid var(--pk-border); }
  .search-bar input { border: none; background: transparent; font-size: 14px; color: var(--text); outline: none; flex: 1; font-family: 'Nunito', sans-serif; }
  .search-bar input::placeholder { color: var(--text-hint); }

  /* CATS */
  .cats { display: flex; gap: 8px; padding: 12px 16px; background: var(--white); overflow-x: auto; scrollbar-width: none; border-bottom: 0.5px solid var(--pk-border); }
  .cats::-webkit-scrollbar { display: none; }
  .cat { padding: 6px 14px; border-radius: var(--radius-pill); font-size: 13px; white-space: nowrap; cursor: pointer; border: 0.5px solid var(--pk-border); color: #9D174D; background: var(--white); font-family: 'Nunito', sans-serif; transition: all 0.15s; }
  .cat.active { background: var(--pk-mid); color: #fff; border-color: var(--pk-mid); }
  .cat-plus { background: var(--pk-soft) !important; color: var(--pk-dark) !important; font-weight: 600 !important; border-color: var(--pk-mid) !important; }

  /* MAIN SCROLL AREA */
  .main { flex: 1; overflow-y: auto; padding-bottom: 80px; }
  .section { padding: 16px; }

  /* VIEW TABS */
  .tabs-row { display: flex; background: var(--pk-soft); border-radius: var(--radius-pill); padding: 3px; margin-bottom: 14px; }
  .tab-btn { flex: 1; padding: 8px; font-size: 13px; border: none; background: transparent; color: #9D174D; border-radius: 18px; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 500; transition: all 0.15s; }
  .tab-btn.active { background: var(--white); color: var(--pk-dark); box-shadow: 0 1px 3px rgba(190,24,93,0.1); }

  /* CARDS */
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--white); border-radius: var(--radius); border: 0.5px solid var(--pk-border); padding: 14px; cursor: pointer; transition: border-color 0.15s; }
  .card:active { border-color: var(--pk-mid); }
  .card-top { display: flex; gap: 12px; align-items: flex-start; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; flex-shrink: 0; }
  .av1 { background: #FCE7F3; color: #BE185D; }
  .card-info { flex: 1; min-width: 0; }
  .card-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .card-skill { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--pk-soft); color: #9D174D; border: 0.5px solid var(--pk-border); }
  .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--pk-border); }
  .price { font-size: 15px; font-weight: 600; color: var(--pk-dark); }
  .action-btn { font-size: 12px; padding: 7px 15px; border-radius: var(--radius-pill); background: var(--pk-mid); color: #fff; border: none; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 500; }

  /* FORMS */
  .form-page { padding: 40px 20px; text-align: center; }
  .form-page h2 { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .form-page p { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; line-height: 1.5; }
  .submit-btn { width: 100%; padding: 15px; border-radius: var(--radius-pill); background: var(--pk-mid); color: #fff; border: none; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 12px rgba(244,114,182,0.2); }

  /* TABBAR */
  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: var(--white); border-top: 0.5px solid var(--pk-border); display: flex; padding: 8px 0 max(12px, env(safe-area-inset-bottom)); z-index: 50; }
  .tb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
  .tb svg { width: 22px; height: 22px; color: #d1a8b8; }
  .tb.active svg { color: var(--pk-mid); }
  .tb-label { font-size: 10px; color: #d1a8b8; }
  .tb.active .tb-label { color: var(--pk-mid); }

  /* BOTTOM SHEET */
  .overlay { position: fixed; inset: 0; background: rgba(190,24,93,0.12); display: flex; align-items: flex-end; z-index: 100; backdrop-filter: blur(2px); }
  .sheet { background: var(--white); border-radius: 24px 24px 0 0; padding: 24px; width: 100%; max-width: 390px; margin: 0 auto; max-height: 82vh; overflow-y: auto; }
  .btn-primary { flex: 1; padding: 14px; border-radius: var(--radius-pill); background: var(--pk-mid); color: #fff; border: none; font-size: 15px; font-weight: 600; text-align: center; text-decoration: none; display: block; margin-top: 10px; }
  .btn-sec { flex: 1; padding: 14px; border-radius: var(--radius-pill); background: var(--pk-soft); color: var(--pk-dark); border: 0.5px solid var(--pk-border); font-size: 15px; cursor: pointer; margin-top: 10px; width: 100%; }

  .page { display: none; }
  .page.active { display: block; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="app">
  <div id="pg-home" class="page active">
    <div class="header">
      <div class="logo">Bloom<span>ci</span></div>
      <div class="search-bar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F472B6" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="搜搜看：3D建模、PPT美化、代跑腿..." />
      </div>
    </div>
    <div class="cats">
      <div class="cat active" onclick="filterCat(this,'全部')">全部</div>
      <div class="cat" onclick="filterCat(this,'设计')">设计</div>
      <div class="cat" onclick="filterCat(this,'写代码')">写代码</div>
      <div class="cat" onclick="filterCat(this,'视频')">视频</div>
      <div class="cat cat-plus" onclick="window.location.href='https://pcnmk88r2xgt.feishu.cn/share/base/form/shrcn61RgTQjm1JTvpKQNMP9wSd'">+ 自定义/其他</div>
    </div>
    <div class="main">
      <div class="section">
        <div class="tabs-row">
          <button class="tab-btn active" onclick="switchView(this,'skills')">技能广场</button>
          <button class="tab-btn" onclick="switchView(this,'demands')">需求竞标</button>
        </div>
        <div id="view-skills">
          <div class="cards">
            <div class="card" data-cat="设计" onclick="showSkill(0)">
              <div class="card-top">
                <div class="avatar av1">Bloom</div>
                <div class="card-info">
                  <div class="card-name">示例：3D建模大神</div>
                  <div class="card-skill">欢迎在“发技能”处入驻你的才华</div>
                </div>
              </div>
              <div class="card-bottom">
                <div class="price">¥100起</div>
                <button class="action-btn">查看详情</button>
              </div>
            </div>
          </div>
        </div>
        <div id="view-demands" class="hidden">
           <div class="cards">
            <div class="card" onclick="showDemand(0)">
              <div class="card-top">
                <div class="avatar av1">需</div>
                <div class="card-info">
                  <div class="card-name">示例需求：寻找校园Vlog剪辑</div>
                  <div class="card-skill">预算 ¥200-500</div>
                </div>
              </div>
              <div class="card-bottom">
                <div class="price">招募中</div>
                <button class="action-btn">我要投标</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="pg-demand" class="page">
    <div class="form-page">
      <h2>🚀 发布新需求</h2>
      <p>找不到想要的技能？直接发布需求，<br>让校园里的大神们来主动找你！</p>
      <a href="https://pcnmk88r2xgt.feishu.cn/share/base/form/shrcnMJ72zlW4W78InWyRDHMz9b" class="submit-btn">立即发布需求 →</a>
    </div>
  </div>

  <div id="pg-post" class="page">
    <div class="form-page">
      <h2>✨ 入驻人才库</h2>
      <p>不管是专业技能还是生活小才华，<br>在 Bloomci 都能快速变现！</p>
      <a href="https://pcnmk88r2xgt.feishu.cn/share/base/form/shrcn61RgTQjm1JTvpKQNMP9wSd" class="submit-btn">立即提交我的技能 →</a>
    </div>
  </div>

  <div id="pg-profile" class="page">
    <div class="section" style="text-align:center; padding-top:60px;">
      <div style="width:90px; height:90px; background:linear-gradient(135deg, var(--pk-mid), var(--pk-dark)); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:32px; font-weight:bold; box-shadow: 0 10px 20px rgba(190,24,93,0.15);">严</div>
      <h3 style="font-size:20px;">Bloomci 创始人</h3>
      <p style="color:var(--text-muted); margin-top:8px;">让校园技能自由流通</p>
      <div style="margin-top:40px; background:var(--white); border-radius:20px; padding:20px; border:0.5px solid var(--pk-border);">
         <p style="font-size:14px; color:var(--text-muted);">数据后台已由飞书提供支持 ✅</p>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tb active" id="tb-home" onclick="goTab('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.75L12 3l9 6.75V21H15v-5.25H9V21H3z"/></svg><span class="tb-label">首页</span></div>
    <div class="tb" id="tb-demand" onclick="goTab('demand')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M8 8h8M8 16h5"/></svg><span class="tb-label">发需求</span></div>
    <div class="tb" id="tb-post" onclick="goTab('post')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span class="tb-label">发技能</span></div>
    <div class="tb" id="tb-profile" onclick="goTab('profile')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg><span class="tb-label">我的</span></div>
  </div>
</div>

<div class="overlay hidden" id="overlay" onclick="closeSheet(event)">
  <div class="sheet" id="sheet-content"></div>
</div>

<script>
function showSkill(i) {
  document.getElementById('sheet-content').innerHTML = `
    <h3 style="font-size:18px;">技能详情</h3>
    <p style="margin:15px 0; color:#666; line-height:1.6;">这是一个示例技能展示位。当你通过下方的“入驻”按钮提交后，你的专业作品、起步价和联系方式就会出现在这里。</p>
    <a href="https://pcnmk88r2xgt.feishu.cn/share/base/form/shrcn61RgTQjm1JTvpKQNMP9wSd" class="btn-primary">我也要入驻此位置 →</a>
    <button class="btn-sec" onclick="closeSheet()">返回首页</button>
  `;
  document.getElementById('overlay').classList.remove('hidden');
}

function showDemand(i) {
  document.getElementById('sheet-content').innerHTML = `
    <h3 style="font-size:18px;">需求详情</h3>
    <p style="margin:15px 0; color:#666; line-height:1.6;">看到感兴趣的校园需求了吗？点击下方按钮，提交你的报价和方案，直接联系对方。</p>
    <a href="https://pcnmk88r2xgt.feishu.cn/share/base/form/shrcnnAkwH26C6GlVKH7HOimtCf" class="btn-primary">立即参与投标/报价 →</a>
    <button class="btn-sec" onclick="closeSheet()">返回首页</button>
  `;
  document.getElementById('overlay').classList.remove('hidden');
}

function closeSheet(e) {
  if (!e || e.target === document.getElementById('overlay')) document.getElementById('overlay').classList.add('hidden');
}

function goTab(t) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tb').forEach(tb => tb.classList.remove('active'));
  document.getElementById('pg-' + t).classList.add('active');
  document.getElementById('tb-' + t).classList.add('active');
}

function switchView(el, view) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('view-skills').classList.toggle('hidden', view !== 'skills');
  document.getElementById('view-demands').classList.toggle('hidden', view !== 'demands');
}

function filterCat(el, cat) {
  document.querySelectorAll('.cat').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}
</script>
</body>
</html>
